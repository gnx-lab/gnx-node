[package]
name = "gnx-host-agent"
version.workspace = true
edition.workspace = true

[dependencies]
gnx-control-protocol = { path = "../../crates/control-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rcgen = "0.13"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_Environment", "Win32_Storage_FileSystem", "Win32_NetworkManagement_NetManagement", "Win32_UI_Shell", "Win32_Foundation"] }
