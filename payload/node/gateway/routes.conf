# Capacidad: gateway
# Implementación aprobada para este release: Caddy
# app.gnx es estático; compute.gnx valida la CA del backend por HTTPS.
{
  # Gateway certificate/key and backend CA are operator-managed files mounted read-only.
  auto_https disable_redirects
}
https://app.gnx {
  tls /etc/gnx/ca/gateway-cert.pem /etc/gnx/ca/gateway-key.pem
  root * /srv/gnx-web
  encode gzip
  header {
    Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'"
    Referrer-Policy "no-referrer"
    Strict-Transport-Security "max-age=31536000"
    X-Content-Type-Options "nosniff"
  }
  file_server
}
https://compute.gnx {
  tls /etc/gnx/ca/gateway-cert.pem /etc/gnx/ca/gateway-key.pem
  reverse_proxy https://127.0.0.1:8006 {
    transport http {
      tls_trust_pool file /etc/gnx/ca/backend-ca.pem
      tls_server_name compute.gnx
    }
  }
}
